<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SlopMaxxer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍝</text></svg>" />
<style>
  /* ---------- tokens ---------- */
  :root {
    color-scheme: dark;
    --bg: #0e0e10; --surface: #161618; --surface-2: #1c1c1f; --surface-3: #242428;
    --line: #2a2a2e; --line-strong: #3a3a40;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8b8a83;
    --claude: #d95926; --codex: #3987e5;           /* identity: follows the provider, never the rank */
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #8b8a83;
    --track: #232327; --tick: #f0efec;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
    --radius: 14px;
    --font: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f4f3f0; --surface-3: #ebeae6;
    --line: #e4e3de; --line-strong: #cfcdc6;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7c7b76;
    --claude: #eb6834; --codex: #2a78d6;
    --track: #ebeae6; --tick: #0b0b0b;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -16px rgba(0,0,0,.2);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }

  /* ---------- layout ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 64px; }
  .topbar { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; gap: 14px; height: 60px; padding-bottom: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .brand .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-3); border: 1px solid var(--line); font-size: 17px; }
  .brand .mark span { display: inline-block; animation: wobble 4s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .tagline { color: var(--text-3); font-size: 13px; margin-left: 4px; }
  .grow { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: ping 2s infinite; }
  .live.off .dot { background: var(--critical); animation: none; }
  @keyframes ping { 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .iconbtn { height: 32px; min-width: 32px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); cursor: pointer; font-size: 12.5px; transition: border-color .15s, color .15s, background .15s; }
  .iconbtn:hover { border-color: var(--line-strong); color: var(--text); }
  .iconbtn.on { color: var(--text); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
  .iconbtn svg { width: 15px; height: 15px; }
  .spin svg { animation: spin .8s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .demo-pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }

  .section-title { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 12px; }
  .section-title h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
  .section-title .hint { font-size: 12px; color: var(--text-3); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .label { font-size: 12px; color: var(--text-3); font-weight: 500; }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: 1.05fr 1.5fr 1fr; gap: 14px; margin-top: 24px; }
  @media (max-width: 980px) { .hero { grid-template-columns: 1fr; } }
  .tile { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 152px; }
  .hero-num { font-size: 52px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: 6px; }
  .hero-num small { font-size: 16px; font-weight: 500; color: var(--text-3); letter-spacing: 0; margin-left: 4px; }
  .rank { font-size: 13px; font-weight: 600; color: var(--text); }
  .scale { position: relative; height: 6px; border-radius: 3px; background: var(--track); margin-top: auto; overflow: visible; }
  .scale .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--text-2); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .scale .mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: var(--tick); border-radius: 1px; }
  .breakdown { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 12px; }
  .brow { display: grid; grid-template-columns: 22px 1fr 34px; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); text-align: right; }
  .btrack { position: relative; height: 6px; border-radius: 3px; background: var(--track); }
  .btrack div { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--c); }
  .btrack i { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--tick); border-radius: 1px; }
  .scale-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }

  .next-who { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .next-who .name { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .next-why { color: var(--text-2); font-size: 13px; }
  .next-stats { display: flex; gap: 22px; margin-top: auto; }
  .next-stats .v { font-size: 18px; font-weight: 650; }

  .resets-num { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-top: 6px; }
  .resets-list { display: flex; flex-direction: column; gap: 4px; margin-top: auto; font-size: 12.5px; color: var(--text-2); }
  .resets-list .row { display: flex; justify-content: space-between; gap: 10px; }

  /* ---------- glyphs & badges ---------- */
  .glyph { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); }
  .glyph svg { width: 18px; height: 18px; color: var(--c); }
  .glyph.sm { width: 22px; height: 22px; border-radius: 7px; } .glyph.sm svg { width: 12px; height: 12px; }
  .claude { --c: var(--claude); } .codex { --c: var(--codex); }
  .status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 650; letter-spacing: .02em; color: var(--text); background: color-mix(in srgb, var(--s) 14%, transparent); border: 1px solid color-mix(in srgb, var(--s) 45%, transparent); white-space: nowrap; }
  .status svg { width: 13px; height: 13px; color: var(--s); flex: none; }
  .s-good { --s: var(--good); } .s-warning { --s: var(--warning); } .s-serious { --s: var(--serious); } .s-critical { --s: var(--critical); } .s-neutral { --s: var(--neutral); }
  .pulse svg { animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.25); } }

  /* ---------- timeline ---------- */
  .timeline { padding: 16px 20px 12px; }
  .tl-axis, .tl-lane { display: grid; grid-template-columns: 240px 1fr; align-items: center; gap: 14px; }
  .tl-axis .ticks { position: relative; height: 18px; }
  .tl-axis .tick { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .tl-axis .tick.now { color: var(--text); font-weight: 600; transform: none; }
  .tl-lane { height: 34px; border-top: 1px solid var(--line); }
  .tl-lane .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); min-width: 0; }
  .tl-lane .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-track { position: relative; height: 100%; }
  .tl-track .day { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .tl-track .bar { position: absolute; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 2px; background: color-mix(in srgb, var(--c) 45%, transparent); }
  .tl-mark { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); cursor: default; }
  .tl-mark.session { width: 10px; height: 10px; border-radius: 3px; }
  .tl-mark:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); }
  .tl-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11.5px; color: var(--text-3); }
  .tl-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--text-3); margin-right: 6px; vertical-align: -1px; }
  .tl-legend i.sq { border-radius: 3px; width: 9px; height: 9px; }

  /* ---------- account cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(372px, 1fr)); gap: 14px; }
  .acct { padding: 18px 20px 16px; display: flex; flex-direction: column; position: relative; transition: border-color .2s; }
  .acct.nextup { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
  .acct-head { display: flex; align-items: center; gap: 12px; }
  .acct-head .id { min-width: 0; flex: 1; }
  .acct-head .name { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-head .meta { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .headline { margin: 14px 0 4px; font-size: 13px; color: var(--text-2); min-height: 20px; }
  .nexttag { font-size: 10.5px; font-weight: 650; color: var(--text); background: color-mix(in srgb, var(--c) 18%, var(--surface-2)); border-radius: 5px; padding: 1px 6px; margin-right: 7px; }

  .meter { margin-top: 16px; }
  .meter .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .meter .name { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .meter .pct { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .meter .reset { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .meter .reset b { color: var(--text-2); font-weight: 600; }
  .track { position: relative; height: 10px; border-radius: 5px; background: var(--track); }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--c); transition: width .9s cubic-bezier(.2,.8,.2,1); min-width: 4px; }
  .track .fill.zero { min-width: 0; }
  .track .pace { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--tick); }
  .track .proj { position: absolute; top: 0; bottom: 0; border-radius: 0 5px 5px 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 40%, transparent) 0 3px, transparent 3px 6px); }
  .meter .idle { font-size: 12px; color: var(--text-3); margin-top: 6px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 18px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .kpi { background: var(--surface-2); padding: 9px 11px; }
  .kpi .v { font-size: 15px; font-weight: 650; margin-top: 1px; }
  .kpi .label { font-size: 11px; }

  .spark-wrap { position: relative; margin: 16px 0 14px; }
  .spark-wrap .label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .spark { display: block; width: 100%; height: 48px; overflow: visible; }
  .spark .hit { fill: transparent; }
  .spark-empty { height: 48px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px; font-size: 12px; color: var(--text-3); }

  .acct-foot { margin-top: auto !important; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
  .chip svg { width: 13px; height: 13px; color: var(--text-3); }
  .chip.has { color: var(--text); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
  .chip.has svg { color: var(--good); }
  .err { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; color: var(--text); background: color-mix(in srgb, var(--critical) 10%, transparent); border: 1px solid color-mix(in srgb, var(--critical) 40%, transparent); }
  .note { margin-top: 10px; font-size: 12px; color: var(--text-3); }

  .empty { padding: 48px 24px; text-align: center; color: var(--text-2); }
  .empty code { background: var(--surface-3); padding: 2px 6px; border-radius: 5px; font-family: var(--mono); font-size: 12.5px; }
  footer { margin-top: 36px; font-size: 12px; color: var(--text-3); text-align: center; }

  /* ---------- tooltip ---------- */
  #tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 10px; font-size: 12px; color: var(--text); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .1s; max-width: 260px; }
  #tip .t { color: var(--text-3); font-size: 11px; margin-bottom: 2px; }

  /* ---------- skeleton & fx ---------- */
  .skel { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .burst { position: fixed; pointer-events: none; font-size: 22px; animation: fly 1.5s ease-out forwards; z-index: 30; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <div class="brand"><div class="mark"><span>🍝</span></div>SlopMaxxer</div>
    <div class="tagline" id="tagline"></div>
    <span class="demo-pill" id="demoPill" hidden>DEMO DATA</span>
    <div class="grow"></div>
    <span class="live" id="live"><span class="dot"></span><span id="updated">connecting…</span></span>
    <button class="iconbtn" id="notify" title="Desktop alerts when an account needs attention"></button>
    <button class="iconbtn" id="theme" title="Toggle light / dark"></button>
    <button class="iconbtn" id="refresh" title="Refresh now">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</div>

<main class="wrap">
  <section class="hero">
    <div class="card tile" id="meterTile"></div>
    <div class="card tile" id="nextTile"></div>
    <div class="card tile" id="resetsTile"></div>
  </section>

  <div class="section-title"><h2>Refill timeline</h2><span class="hint">when each limit window refills, the next 7 days</span></div>
  <section class="card timeline" id="timeline"></section>

  <div class="section-title"><h2>Accounts</h2><span class="hint" id="acctCount"></span></div>
  <section class="grid" id="cards"></section>

  <footer>Reads the logins your Claude Code &amp; Codex CLIs already have · never changes them · runs only on 127.0.0.1</footer>
</main>
<div id="tip"></div>

<script>
/* ---------- constants ---------- */
const ICONS = {
  claude: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.6 6.1 5.6-2.9-3.6 5.1 6 1.7-6.1 1.3 3.9 4.8-5.7-2.6-.9 6.4-1.8-6.1-4.9 3.9 2.5-5.8-6.3.3 5.6-2.9-4.6-4.3 6 1.6z"/></svg>',
  codex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-3 3 3 3"/><path d="M13 15h6"/><rect x="2.5" y="3.5" width="19" height="17" rx="4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5.5 12.5L12 19l6.5-6.5"/></svg>',
  alarm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2"/><path d="M4 4.5l3 -2M20 4.5l-3-2"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 9.6-4.8M18 9c0 6 2.5 7.5 2.5 7.5H8"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg>',
  ticket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>',
};
// Verdict → status role (reserved colors, always with icon + label)
const VERDICTS = {
  COOKED:    { label: 'Cooked',            role: 'critical', icon: 'stop' },
  SLOW_DOWN: { label: 'Slow down',         role: 'serious',  icon: 'down' },
  LOSE_IT:   { label: 'Use it or lose it', role: 'serious',  icon: 'alarm', pulse: true },
  PICK_UP:   { label: 'Pick it up',        role: 'warning',  icon: 'up' },
  IDLE:      { label: 'Window asleep',     role: 'neutral',  icon: 'pause' },
  WAIT:      { label: 'Wait for reset',    role: 'neutral',  icon: 'pause' },
  ON_PACE:   { label: 'On pace',           role: 'good',     icon: 'check' },
  MAXXED:    { label: 'Maxxed',            role: 'good',     icon: 'check' },
  UNKNOWN:   { label: 'No data',           role: 'neutral',  icon: 'plug' },
};
const RANKS = [[0, '🪦 Token Graveyard'], [40, '🐌 Casual Prompter'], [70, '🍝 Slop Apprentice'], [90, '🔥 Slop Chef'], [105, '🧠 Certified SlopMaxxer'], [130, '🚀 Rate-Limit Speedrunner']];
const TAGLINES = ['every token unused is a token wasted', 'your agents are idle — this is a cry for help', 'the weekly limit fears you', 'leave no token behind', 'slop responsibly'];
const PROVIDER = { claude: 'Claude', codex: 'Codex' };

/* ---------- state & helpers ---------- */
let snap = null, online = true;
let lastVerdicts = JSON.parse(localStorage.getItem('slop.verdicts') || '{}');
let notifyOn = localStorage.getItem('slop.notify') === '1' && 'Notification' in window && Notification.permission === 'granted';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const who = (a) => a.nickname || a.email || a.dirs?.[0] || a.dir || 'Unknown account';
const glyph = (p, sm) => `<div class="glyph ${p} ${sm ? 'sm' : ''}">${ICONS[p] || ICONS.plug}</div>`;
const statusBadge = (v) => { const d = VERDICTS[v] || VERDICTS.UNKNOWN; return `<span class="status s-${d.role} ${d.pulse ? 'pulse' : ''}">${ICONS[d.icon]}${d.label}</span>`; };
const focusWin = (a) => a.windows.find((w) => w.kind === 'weekly') || a.windows[0];

function dur(ms, short) {
  if (ms == null || !isFinite(ms)) return '—';
  if (ms <= 0) return 'now';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (d) return short ? `${d}d ${h}h` : `${d}d ${h}h ${m}m`;
  if (h) return short ? `${h}h ${m}m` : `${h}h ${m}m ${String(sec).padStart(2, '0')}s`;
  return short ? `${m}m` : `${m}m ${String(sec).padStart(2, '0')}s`;
}
const rate = (r) => (r == null || !isFinite(r) ? '—' : r < 10 ? `${r.toFixed(1)}%/h` : `${Math.round(r)}%/h`);
const when = (t) => new Date(t).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });

/* ---------- tooltip ---------- */
const tip = $('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(e); }
function moveTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.opacity = 0; }
document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) showTip(e, t.dataset.tip); });
document.addEventListener('mousemove', (e) => { if (e.target.closest('[data-tip]')) moveTip(e); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });

/* ---------- hero tiles ---------- */
function renderMeter(accts) {
  const scores = accts.map((a) => a.slopScore).filter((s) => s != null);
  const score = scores.length ? Math.round(scores.reduce((x, y) => x + Math.min(100, y), 0) / scores.length) : null; // overcooking one account doesn’t excuse idling another
  const rank = score == null ? '' : RANKS.filter(([m]) => score >= m).pop()[1];
  const fill = score == null ? 0 : Math.min(100, score / 2);
  $('meterTile').innerHTML = `
    <div class="label">Slop-o-meter</div>
    <div class="hero-num">${score ?? '—'}<small>${score != null ? '/ 100 = on pace' : ''}</small></div>
    <div class="rank">${rank}</div>
    <div class="breakdown">${accts.filter((a) => a.slopScore != null).map((a) => `<div class="brow ${a.provider}" data-tip="${esc(PROVIDER[a.provider] + ' · ' + who(a))}: ${a.slopScore}% of pace">${glyph(a.provider, true)}<div class="btrack"><div style="width:${Math.min(100, a.slopScore / 2)}%"></div><i></i></div><span class="tnum">${a.slopScore}</span></div>`).join('')}</div>
    <div class="scale-legend" style="margin-top:auto"><span>each account vs. its pace line</span><span>│ = on pace</span></div>`;
}

function renderNext(accts) {
  const next = accts.find((a) => a.id === snap.nextUp);
  if (!next) {
    $('nextTile').innerHTML = `<div class="label">Next task goes to</div>
      <div class="next-who"><div class="name">${accts.length ? 'Everything is cooked 🔥' : 'No accounts yet'}</div></div>
      <div class="next-why">${accts.length ? 'Go touch grass — the limits will be back.' : 'Log in with <code>claude</code> or <code>codex</code>.'}</div>`;
    return;
  }
  const w = focusWin(next);
  const sess = next.windows.find((x) => x.kind === 'session');
  $('nextTile').innerHTML = `
    <div class="label">Next task goes to</div>
    <div class="next-who">${glyph(next.provider)}<div><div class="name">${PROVIDER[next.provider]} · ${esc(who(next))}</div>
      <div class="next-why">Most capacity expiring soonest. ${esc(next.headline)}</div></div></div>
    <div class="next-stats">
      <div><div class="label">Weekly left</div><div class="v tnum">${Math.round(100 - w.usedPercent)}%</div></div>
      <div><div class="label">Refills in</div><div class="v tnum" data-count="${w.resetsAt}" data-short="1"></div></div>
      <div><div class="label">Spend to max</div><div class="v tnum">${rate(w.neededPerHour)}</div></div>
      ${sess ? `<div><div class="label">5-hour</div><div class="v tnum">${sess.idle ? 'asleep' : Math.round(sess.usedPercent) + '%'}</div></div>` : ''}
    </div>`;
}

function renderResets(accts) {
  const codex = accts.filter((a) => a.provider === 'codex');
  const claude = accts.filter((a) => a.provider === 'claude');
  const banked = codex.reduce((n, a) => n + (a.resetCredits || 0), 0);
  const known = codex.some((a) => a.resetCredits != null);
  const nextRefill = accts.flatMap((a) => a.windows.filter((w) => !w.idle).map((w) => ({ a, w }))).sort((x, y) => x.w.resetsAt - y.w.resetsAt)[0];
  $('resetsTile').innerHTML = `
    <div class="label">Banked resets</div>
    <div class="resets-num tnum">${known ? banked : '—'}</div>
    <div class="next-why">${banked ? 'A banked reset clears a used-up limit instantly. Save it for a week you hit the cap early.' : known ? 'None banked right now. Codex adds them now and then.' : 'Couldn’t read reset credits.'}</div>
    <div class="resets-list">
      ${codex.map((a) => `<div class="row"><span>${PROVIDER.codex} · ${esc(who(a))}</span><b class="tnum">${a.resetCredits ?? '—'}</b></div>`).join('')}
      ${claude.length ? `<div class="row"><span>${PROVIDER.claude}</span><span>not offered</span></div>` : ''}
      ${nextRefill ? `<div class="row" style="margin-top:4px;color:var(--text-3)"><span>Next refill: ${PROVIDER[nextRefill.a.provider]} ${esc(nextRefill.w.label)}</span><span class="tnum" data-count="${nextRefill.w.resetsAt}" data-short="1"></span></div>` : ''}
    </div>`;
}

/* ---------- timeline ---------- */
function renderTimeline(accts) {
  const now = Date.now(), span = 7 * 86400_000;
  const x = (t) => Math.max(0, Math.min(100, ((t - now) / span) * 100));
  const ticks = [];
  const d0 = new Date(now); d0.setHours(24, 0, 0, 0);
  for (let t = +d0; t < now + span; t += 86400_000) ticks.push(t);
  const ticksHtml = `<span class="tick now" style="left:0">Now</span>` + ticks.filter((t) => x(t) > 6 && x(t) < 97).map((t) =>
    `<span class="tick" style="left:${x(t)}%">${new Date(t).toLocaleDateString([], { weekday: 'short' })}</span>`).join('');
  const lanes = accts.filter((a) => a.windows.length).map((a) => {
    const days = ticks.map((t) => `<div class="day" style="left:${x(t)}%"></div>`).join('');
    const marks = a.windows.filter((w) => !w.idle && w.resetsAt - now < span).map((w) => {
      const t = `<div class="t">${PROVIDER[a.provider]} · ${esc(who(a))}</div><b>${esc(w.label)}</b> refills ${when(w.resetsAt)}<br/>${Math.round(100 - w.usedPercent)}% unused right now`;
      return `${w.kind === 'weekly' ? `<div class="bar" style="left:0;width:${x(w.resetsAt)}%"></div>` : ''}
        <div class="tl-mark ${w.kind === 'weekly' ? '' : 'session'}" style="left:${x(w.resetsAt)}%" data-tip="${esc(t)}"></div>`;
    }).join('');
    return `<div class="tl-lane ${a.provider}"><div class="who">${glyph(a.provider, true)}<span>${PROVIDER[a.provider]} · ${esc(who(a))}</span></div><div class="tl-track">${days}${marks}</div></div>`;
  }).join('');
  $('timeline').innerHTML = `
    <div class="tl-axis"><div></div><div class="ticks">${ticksHtml}</div></div>
    ${lanes || '<div class="label" style="padding:12px 0">No active windows.</div>'}
    <div class="tl-legend"><span><i></i>weekly refill</span><span><i class="sq"></i>5-hour refill</span><span>bar = weekly capacity still to spend</span></div>`;
}

/* ---------- account cards ---------- */
function meterHtml(w) {
  const used = Math.min(100, w.usedPercent);
  if (w.idle) return `<div class="meter"><div class="top"><span class="name">${esc(w.label)}</span><span class="pct tnum">${Math.round(w.usedPercent)}%</span><span class="reset">not started</span></div>
    <div class="track"><div class="fill zero" style="width:${used}%"></div></div><div class="idle">The clock starts on your next prompt.</div></div>`;
  const proj = Math.min(100, Math.max(used, w.projectedPercent));
  const tipText = `<div class="t">${esc(w.label)}</div>${Math.round(w.usedPercent)}% used · pace line ${Math.round(w.expectedPercent)}%<br/>At the current rate: ~${Math.round(Math.min(100, w.projectedPercent))}% at reset<br/>Refills ${when(w.resetsAt)}`;
  return `<div class="meter" data-tip="${esc(tipText)}">
    <div class="top"><span class="name">${esc(w.label)}</span><span class="pct tnum">${Math.round(w.usedPercent)}%</span>
      <span class="reset">refills in <b class="tnum" data-count="${w.resetsAt}"></b></span></div>
    <div class="track">
      <div class="proj" style="left:${used}%;width:${proj - used}%"></div>
      <div class="fill ${used === 0 ? 'zero' : ''}" style="width:${used}%"></div>
      <div class="pace" style="left:${Math.min(100, w.expectedPercent)}%"></div>
    </div></div>`;
}

function sparkHtml(a) {
  const pts = a.spark || [];
  if (pts.length < 2) return `<div class="spark-empty">Usage history fills in as SlopMaxxer runs</div>`;
  const W = 300, Hh = 48, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const px = (t) => ((t - t0) / (t1 - t0 || 1)) * W, py = (v) => Hh - 3 - (Math.min(100, v) / 100) * (Hh - 6);
  const line = pts.map(([t, v], i) => `${i ? 'L' : 'M'}${px(t).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const area = `${line} L${W},${Hh} L0,${Hh} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" data-spark='${JSON.stringify(pts)}'>
    <defs><linearGradient id="g-${a.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c)" stop-opacity=".28"/><stop offset="1" stop-color="var(--c)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g-${a.id})"/><path d="${line}" fill="none" stroke="var(--c)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <line class="xh" x1="0" x2="0" y1="0" y2="${Hh}" stroke="var(--text-3)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
    <circle class="dotp" r="3.5" fill="var(--c)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect class="hit" x="0" y="0" width="${W}" height="${Hh}"/></svg>`;
}

function cardHtml(a) {
  const w = a.windows.length ? focusWin(a) : null;
  const isNext = snap.nextUp === a.id;
  const meta = [PROVIDER[a.provider], a.plan, a.org].filter(Boolean).map(esc).join(' · ');
  const kpis = w && !w.idle ? `<div class="kpis">
      <div class="kpi"><div class="label">Pace line</div><div class="v tnum">${Math.round(w.expectedPercent)}%</div></div>
      <div class="kpi"><div class="label">Burning</div><div class="v tnum">${rate(w.ratePerHour)}</div></div>
      <div class="kpi"><div class="label">To max out</div><div class="v tnum">${w.usedPercent >= 99.5 ? 'done' : rate(w.neededPerHour)}</div></div>
      <div class="kpi"><div class="label">At reset</div><div class="v tnum">~${Math.round(Math.min(100, w.projectedPercent))}%</div></div>
    </div>` : '';
  const resets = a.provider === 'codex'
    ? `<span class="chip ${a.resetCredits ? 'has' : ''}" data-tip="Banked resets clear a used-up limit instantly.">${ICONS.ticket}${a.resetCredits == null ? 'resets: unknown' : `${a.resetCredits} banked reset${a.resetCredits === 1 ? '' : 's'}`}</span>`
    : `<span class="chip" data-tip="Claude doesn't offer banked resets.">${ICONS.ticket}no banked resets</span>`;
  const source = a.windows.length ? `<span class="chip" data-tip="${a.stale ? esc(a.note || 'Data may be stale') : 'Same numbers as /usage and /status'}">${a.stale ? 'from logs' : 'live'}</span>` : '';
  return `<article class="card acct ${a.provider} ${isNext ? 'nextup' : ''}">
    <div class="acct-head">${glyph(a.provider)}
      <div class="id"><div class="name" title="${esc(who(a))}">${esc(who(a))}</div><div class="meta">${isNext ? '<span class="nexttag">👑 Next up</span>' : ''}${meta}</div></div>
      ${statusBadge(a.verdict)}
    </div>
    <div class="headline">${esc(a.headline)}</div>
    ${a.error && !a.windows.length ? `<div class="err">${esc(a.error)}</div>` : ''}
    ${a.windows.map(meterHtml).join('')}
    ${kpis}
    ${a.windows.length ? `<div class="spark-wrap"><div class="label"><span>Weekly usage, last 7 days</span></div>${sparkHtml(a)}</div>` : ''}
    <div class="acct-foot">${resets}${source}${a.extraUsage ? '<span class="chip">extra usage on</span>' : ''}</div>
    ${a.note && a.windows.length ? `<div class="note">${esc(a.note)}</div>` : ''}
  </article>`;
}

function bindSparks() {
  for (const svg of document.querySelectorAll('svg[data-spark]')) {
    const pts = JSON.parse(svg.dataset.spark), t0 = pts[0][0], t1 = pts[pts.length - 1][0];
    const xh = svg.querySelector('.xh'), dot = svg.querySelector('.dotp');
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect(), f = (e.clientX - r.left) / r.width, t = t0 + f * (t1 - t0);
      let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
      const x = ((best[0] - t0) / (t1 - t0 || 1)) * 300, y = 48 - 3 - (Math.min(100, best[1]) / 100) * 42;
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      xh.setAttribute('visibility', 'visible'); dot.setAttribute('visibility', 'visible');
      showTip(e, `<div class="t">${when(best[0])}</div><b>${Math.round(best[1])}%</b> of weekly used`);
    });
    svg.addEventListener('mouseleave', () => { xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); hideTip(); });
  }
}

/* ---------- render loop ---------- */
function render() {
  if (!snap) return;
  const accts = snap.accounts;
  $('demoPill').hidden = !snap.demo;
  renderMeter(accts); renderNext(accts); renderResets(accts); renderTimeline(accts);
  $('acctCount').textContent = `${accts.length} found on this machine`;
  $('cards').innerHTML = accts.length ? accts.map(cardHtml).join('')
    : `<div class="card empty">No Claude Code or Codex logins found.<br/><br/>Run <code>claude</code> or <code>codex</code> and log in. SlopMaxxer finds them automatically.</div>`;
  bindSparks(); tick(); checkAlerts();
}

function tick() {
  for (const el of document.querySelectorAll('[data-count]')) {
    const ms = Number(el.dataset.count) - Date.now();
    el.textContent = ms > 0 ? dur(ms, el.dataset.short) : 'refilling…';
  }
  const live = $('live');
  live.classList.toggle('off', !online);
  if (snap) { const age = Date.now() - snap.generatedAt; $('updated').textContent = !online ? 'Server offline' : age < 60000 ? 'Live · updated just now' : `Live · updated ${dur(age, true)} ago`; }
}

function skeleton() {
  for (const id of ['meterTile', 'nextTile', 'resetsTile']) $(id).innerHTML = '<div class="skel" style="height:14px;width:40%"></div><div class="skel" style="height:44px;width:60%;margin-top:10px"></div><div class="skel" style="height:10px;margin-top:auto"></div>';
  $('timeline').innerHTML = '<div class="skel" style="height:90px"></div>';
  $('cards').innerHTML = '<div class="card acct"><div class="skel" style="height:260px"></div></div>'.repeat(2);
}

function burst(emojis = ['🍝', '✨', '🔥', '🪙']) {
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    s.className = 'burst'; s.textContent = emojis[i % emojis.length];
    s.style.left = '50%'; s.style.top = '35%';
    s.style.setProperty('--dx', `${(Math.random() - 0.5) * 900}px`);
    s.style.setProperty('--dy', `${(Math.random() - 0.3) * 600}px`);
    s.style.setProperty('--rot', `${(Math.random() - 0.5) * 720}deg`);
    document.body.appendChild(s); setTimeout(() => s.remove(), 1600);
  }
}

function checkAlerts() {
  if (snap.demo) return;
  const LOUD = ['LOSE_IT', 'PICK_UP', 'IDLE', 'SLOW_DOWN'];
  for (const a of snap.accounts) {
    const prev = lastVerdicts[a.id];
    if (prev && prev !== a.verdict) {
      if (a.verdict === 'MAXXED' || (['COOKED', 'WAIT'].includes(prev) && !['COOKED', 'WAIT'].includes(a.verdict))) burst();
      if (notifyOn && LOUD.includes(a.verdict)) new Notification(`${VERDICTS[a.verdict].label} · ${PROVIDER[a.provider]}`, { body: a.headline, tag: a.id });
    }
    lastVerdicts[a.id] = a.verdict;
  }
  localStorage.setItem('slop.verdicts', JSON.stringify(lastVerdicts));
}

async function load(force) {
  try {
    const r = await fetch('/api/snapshot' + (force ? '?refresh=1' : ''));
    snap = await r.json(); online = true; render();
  } catch { online = false; tick(); }
}

/* ---------- controls ---------- */
function paintControls() {
  $('notify').innerHTML = (notifyOn ? ICONS.bell : ICONS.bellOff) + (notifyOn ? 'Alerts on' : 'Alerts off');
  $('notify').classList.toggle('on', notifyOn);
  const dark = document.documentElement.dataset.theme === 'dark';
  $('theme').innerHTML = dark ? ICONS.sun : ICONS.moon;
}
$('notify').onclick = async () => {
  if (!('Notification' in window)) return;
  if (!notifyOn && Notification.permission !== 'granted') await Notification.requestPermission();
  notifyOn = !notifyOn && Notification.permission === 'granted';
  localStorage.setItem('slop.notify', notifyOn ? '1' : '0'); paintControls();
};
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; localStorage.setItem('slop.theme', t); paintControls();
};
$('refresh').onclick = async () => {
  const b = $('refresh'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  await load(true);
};

document.documentElement.dataset.theme = localStorage.getItem('slop.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
$('tagline').textContent = TAGLINES[Math.floor(Math.random() * TAGLINES.length)];
paintControls(); skeleton(); load();
setInterval(tick, 1000);
setInterval(() => load(), 30_000);
setInterval(() => renderTimeline(snap?.accounts || []), 60_000);
// When a window refills, refetch right away instead of waiting for the next poll.
setInterval(() => {
  if (snap?.accounts.some((a) => a.windows.some((w) => !w.idle && w.resetsAt < Date.now() && w.resetsAt > Date.now() - 1000))) setTimeout(() => load(true), 5000);
}, 1000);
</script>
</body>
</html>
