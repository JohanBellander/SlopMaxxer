name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # SlopMaxxer runs on both Windows and macOS; prove each change on both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['20', 'lts/*'] # the engines floor and the current LTS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:package
